<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111827'/%3E%3Cpath d='M16 6l7 3v5.5c0 4.5-3 7.4-7 9-4-1.6-7-4.5-7-9V9l7-3z' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M12.5 15.5l2.4 2.4 4.6-4.6' fill='none' stroke='%2322c55e' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pentest Agent · 安全评估工作台</title>
    <script>
      // 首屏前应用主题，避免闪烁（与 App 内 theme 状态保持一致）
      (function () {
        try {
          var saved = localStorage.getItem("pa-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
